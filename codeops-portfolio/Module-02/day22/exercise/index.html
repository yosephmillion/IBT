<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">

    <title>Birr Watch</title>
</head>

<body>

    <main class="main">

        <h1>Birr Watch</h1>
        <p>ETB Currency Converter</p>

        
        <div class="status" id="status">
            Loading...
        </div>

        
        <section>
            <h2>Convert ETB</h2>

            <form id="form" class="form">

                <label for="amount">Birr</label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="Enter amount in Birr"
                    min="0"
                    step="0.01"
                    required
                >

                <label for="currency">Convert to</label>

                <select id="currency">
                    <option value="">Loading currencies...</option>
                </select>

                <button type="submit">
                    Convert
                </button>

            </form>
        </section>

        
        <section>
            <h2>Result</h2>

            <div id="result">
                Enter an amount and choose a currency.
            </div>
        </section>

        
        <section>
            <h2>Watchlist</h2>

            <ul id="watchlist" class="watchlist">
                <li class="empty">
                    No currencies in your watchlist.
                </li>
            </ul>
        </section>

    </main>

    <script src="./app.js"></script>

</body>

</html>
